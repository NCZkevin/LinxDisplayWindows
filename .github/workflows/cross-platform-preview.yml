name: Build and publish cross-platform preview

on:
  push:
    tags:
      - "v*-preview*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/LinxDisplay.Desktop/LinxDisplay.Desktop.csproj"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match desktop project version $version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: Windows-x64
            single_file: true
            extract_native: true
          - os: macos-latest
            rid: osx-arm64
            asset: macOS-AppleSilicon
            single_file: true
            extract_native: true
          - os: macos-latest
            rid: osx-x64
            asset: macOS-Intel
            single_file: true
            extract_native: true
          - os: ubuntu-latest
            rid: linux-x64
            asset: Linux-x64
            single_file: true
            extract_native: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet run --project tests/LinxDisplay.CrossPlatform.Tests --configuration Release

      - name: Publish self-contained app
        run: >-
          dotnet publish src/LinxDisplay.Desktop/LinxDisplay.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=${{ matrix.single_file }}
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.extract_native }}
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .release/publish

      - name: Remove native debug symbols
        shell: pwsh
        run: Get-ChildItem .release/publish -Recurse -Filter "*.pdb" | Remove-Item -Force

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "LinxDisplay-${{ matrix.asset }}-v${{ needs.verify.outputs.version }}.zip"
          Compress-Archive -Path ".release/publish/*" -DestinationPath ".release/$name"

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/package-macos.sh \
            .release/publish \
            .release \
            "${{ matrix.asset }}" \
            "${{ needs.verify.outputs.version }}" \
            "${{ matrix.rid }}"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x .release/publish/LinxDisplay
          tar -C .release/publish -czf ".release/LinxDisplay-${{ matrix.asset }}-v${{ needs.verify.outputs.version }}.tar.gz" .

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: .release/LinxDisplay-${{ matrix.asset }}-v${{ needs.verify.outputs.version }}.*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: .release
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: cd .release && sha256sum LinxDisplay-* > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" .release/* \
            --verify-tag --prerelease \
            --title "LinxDisplay ${{ github.ref_name }}" \
            --notes "跨平台预览版，支持 Windows、macOS（Apple Silicon/Intel）和 Linux。Windows 解压后运行 EXE；macOS 解压后将应用拖入 Applications；Linux 解压后运行 LinxDisplay。此版本尚未进行 Apple 代码签名，macOS 首次启动可能需要在系统设置中手动允许。"
