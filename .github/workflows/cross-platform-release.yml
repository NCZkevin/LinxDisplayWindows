name: Build and publish cross-platform release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          [xml]$project = Get-Content "src/LinxDisplay.Desktop/LinxDisplay.Desktop.csproj"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match desktop project version $version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: Windows-x64
            extension: zip
            single_file: true
            extract_native: true
          - os: macos-latest
            rid: osx-arm64
            asset: macOS-AppleSilicon
            extension: zip
            single_file: true
            extract_native: true
          - os: macos-latest
            rid: osx-x64
            asset: macOS-Intel
            extension: zip
            single_file: true
            extract_native: true
          - os: ubuntu-latest
            rid: linux-x64
            asset: Linux-x64
            extension: tar.gz
            single_file: true
            extract_native: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet run --project tests/LinxDisplay.CrossPlatform.Tests --configuration Release

      - name: Publish self-contained app
        run: >-
          dotnet publish src/LinxDisplay.Desktop/LinxDisplay.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=${{ matrix.single_file }}
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.extract_native }}
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .release/publish

      - name: Remove native debug symbols
        shell: pwsh
        run: Get-ChildItem .release/publish -Recurse -Filter "*.pdb" | Remove-Item -Force

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "LinxDisplay-${{ matrix.asset }}-v${{ needs.verify.outputs.version }}.zip"
          Compress-Archive -Path ".release/publish/*" -DestinationPath ".release/$name"

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/package-macos.sh \
            .release/publish \
            .release \
            "${{ matrix.asset }}" \
            "${{ needs.verify.outputs.version }}" \
            "${{ matrix.rid }}"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x .release/publish/LinxDisplay
          tar -C .release/publish -czf ".release/LinxDisplay-${{ matrix.asset }}-v${{ needs.verify.outputs.version }}.tar.gz" .

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: .release/LinxDisplay-${{ matrix.asset }}-v${{ needs.verify.outputs.version }}.${{ matrix.extension }}
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: .release
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: cd .release && sha256sum LinxDisplay-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          release_flags=(--latest)
          release_kind="正式版"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease)
            release_kind="预览版"
          fi
          notes="LinxDisplay 跨平台${release_kind}，支持 Windows、macOS（Apple Silicon/Intel）和 Linux。Windows 解压后运行 EXE；macOS 解压后将应用拖入 Applications；Linux 解压后运行 LinxDisplay。macOS 包尚未使用 Apple Developer ID 公证，首次启动可能需要在系统设置中手动允许。"
          gh release create "$RELEASE_TAG" .release/* \
            --verify-tag "${release_flags[@]}" \
            --title "LinxDisplay $RELEASE_TAG" \
            --notes "$notes"
