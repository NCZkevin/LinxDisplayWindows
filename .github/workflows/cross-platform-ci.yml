name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CodexLinxDisplay.CrossPlatform.slnx

      - name: Build
        run: dotnet build CodexLinxDisplay.CrossPlatform.slnx --configuration Release --no-restore

      - name: Run cross-platform smoke tests
        run: dotnet run --project tests/CodexLinxDisplay.CrossPlatform.Tests --configuration Release --no-build
