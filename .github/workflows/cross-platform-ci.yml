name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CodexLinxDisplay.CrossPlatform.slnx

      - name: Build
        run: dotnet build CodexLinxDisplay.CrossPlatform.slnx --configuration Release --no-restore

      - name: Run cross-platform smoke tests
        run: dotnet run --project tests/CodexLinxDisplay.CrossPlatform.Tests --configuration Release --no-build

  package-macos:
    name: Package macOS (${{ matrix.architecture }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            rid: osx-arm64
            asset: macOS-AppleSilicon
          - architecture: Intel
            rid: osx-x64
            asset: macOS-Intel

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/CodexLinxDisplay.Desktop/CodexLinxDisplay.Desktop.csproj"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained macOS app
        run: >-
          dotnet publish src/CodexLinxDisplay.Desktop/CodexLinxDisplay.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .release/publish

      - name: Build and verify app bundle
        shell: bash
        run: |
          bash scripts/package-macos.sh \
            .release/publish \
            .release \
            "${{ matrix.asset }}" \
            "${{ steps.version.outputs.value }}" \
            "${{ matrix.rid }}"

      - name: Upload installable app bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: .release/CodexLinxDisplay-${{ matrix.asset }}-v${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
